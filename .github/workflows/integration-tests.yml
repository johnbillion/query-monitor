# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Integration Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'tests/integration/**'
      - '**.php'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/integration-tests.yml'
      - 'tests/integration/**'
      - '**.php'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-integration-tests.yml@667f50aeb549afa5a5cf0137a21a08de1bc983f5 # 2.9.3
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        include:
          # Latest:
          - wp: '7.0'
            php: '8.5'
          - wp: '7.0'
            php: '7.4'
          # Latest -1:
          - wp: '6.9'
            php: '8.5'
          - wp: '6.9'
            php: '7.4'
          # Latest -2:
          - wp: '6.8'
            php: '8.4'
          - wp: '6.8'
            php: '7.4'
          # Oldest supported:
          - wp: '6.2'
            php: '8.2'
          - wp: '6.2'
            php: '7.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
