# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Coding Standards
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
      - 'client-side-rendering-feature'
    paths:
      - '.github/workflows/coding-standards.yml'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/coding-standards.yml'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-coding-standards.yml@878b9aa1ed37ebe75529845419b9571610845760 # 1.2.2
    strategy:
      matrix:
        label:
          - 'PHP'
        php:
          - '8.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}
