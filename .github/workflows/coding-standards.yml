# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Coding Standards
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/coding-standards.yml'
      - '**.css'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
      - 'eslint.config.js'
      - '.npmrc'
      - '.nvmrc'
      - '.tsconfig.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/coding-standards.yml'
      - '**.css'
      - '**.js'
      - '**.ts'
      - '**.tsx'
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
      - 'eslint.config.js'
      - '.npmrc'
      - '.nvmrc'
      - '.tsconfig.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-coding-standards.yml@407e1d8405b366f95664ce4ec62127eb9ecad808 # 2.9.0
    strategy:
      matrix:
        label:
          - 'PHP'
        php:
          - '8.4'
      fail-fast: false
    with:
      php: ${{ matrix.php }}

  typescript:
    name: TypeScript
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
