# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Acceptance Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
      - 'client-side-rendering-feature'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
      - 'tsconfig.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/acceptance/**'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        wp:
          # Three most recent versions of WordPress
          - '6.9'
          - '6.8'
          - '6.7'
        php:
          # Most recent version of PHP supported by all of the above, plus 7.4
          - '8.4'
          - '7.4'
        include:
          # Latest WordPress on latest PHP
          # - wp: '6.9'
          #   php: '8.5'
          # Oldest supported WordPress on its newest supported PHP, plus 7.4:
          - wp: '6.1'
            php: '8.2'
          - wp: '6.1'
            php: '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@1bf8b2cc9ee7211d0ac2e5d7f82bc9a151d7d094 # 2.7.2
    with:
      node: true
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
