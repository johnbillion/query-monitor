# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Acceptance Tests
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/**'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'codeception.dist.yml'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/acceptance-tests.yml'
      - 'tests/**'
      - '**.css'
      - '**.scss'
      - '**.js'
      - '**.php'
      - 'codeception.dist.yml'
      - 'composer.json'
      - 'docker-compose.yml'
      - 'package.json'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: WP ${{ matrix.wp }}
    permissions:
      contents: read
    strategy:
      # See the following for PHP compatibility of WordPress versions:
      # https://make.wordpress.org/core/handbook/references/php-compatibility-and-wordpress-versions/
      matrix:
        wp:
          # Three most recent versions of WordPress
          - '6.9-beta1'
          - '6.8'
          - '6.7'
        php:
          # Most recent version of PHP supported by all of the above, plus 7.4
          - '8.3'
          - '7.4'
        include:
          # Latest WordPress on PHP 8.4
          - wp: '6.8'
            php: '8.4'
          # Oldest supported WordPress on its newest supported PHP, plus 7.4:
          - wp: '6.1'
            php: '8.2'
          - wp: '6.1'
            php: '7.4'
      fail-fast: false
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-acceptance-tests.yml@33705f771525b0d691ee821c90e0c10b18e02871 # 1.2.1
    with:
      node: true
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
