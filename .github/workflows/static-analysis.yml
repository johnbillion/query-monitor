# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Static Analysis
on:
  push:
    branches:
      - 'develop'
      - 'trunk'
    paths:
      - '.github/workflows/static-analysis.yml'
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/static-analysis.yml'
      - '**.php'
      - 'composer.json'
      - 'phpstan.neon.dist'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Static Analysis
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-static-analysis.yml@e893132e33848f47334e6106eb662f1678faee4c
    with:
      min-php: '7.4'
      max-php: '8.3'
