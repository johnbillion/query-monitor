# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Assets
on:
  push:
    branches:
      - deploy

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-assets.yml@ec0ac8a3e7eb4c806143aff072d098bc1a1ca6c6
    with:
      plugin: query-monitor
      readme: readme.txt
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
