# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deploy Assets
on:
  push:
    branches:
      - deploy

permissions: {}

jobs:
  wordpress:
    name: WordPress.org
    permissions:
      contents: read
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-deploy-assets.yml@3141ee7813718d59c2d4df6d3d94f69a1becc951 # 1.1.0
    with:
      plugin: query-monitor
      readme: readme.txt
      username: johnbillion
    secrets:
      WPORG_SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
