# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-build.yml@52de98a23b5c85d2024c71073ea4ef1770db7428 # 3.0.0
    permissions:
      contents: write # Required to push release branch and tags
    with:
      node: true
      tag: ${{ github.event_name != 'workflow_dispatch' }}
