# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Build
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    uses: johnbillion/plugin-infrastructure/.github/workflows/reusable-build.yml@dd6670e31ed65142203626c4ce1546364a6e48c7 # 1.1.0
    permissions:
      contents: write
    with:
      node: true
      tag: ${{ github.event_name != 'workflow_dispatch' }}
      vendor: true
